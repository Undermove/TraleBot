name: Apply agent read-only access to observability (Loki, Prometheus, Grafana)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}
          context: microk8s

      # Только права к observability: база и приложение не трогаются (в отличие от Deploy Database).
      - name: Apply RBAC
        run: kubectl apply -f ./deploy/agent-rbac-observability.yml

      - name: Show observability pods
        run: kubectl get pods -n observability
