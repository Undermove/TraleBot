# Read-only доступ учётки agent-readonly к Loki: пробросить порт до пода Loki и читать логи
# через его HTTP API (LogQL). Логи подов в tralebot-prod живут только до следующей выкатки,
# а в Loki — за прошлые дни.
#
# Роль в namespace loki (там же, где сам Loki), учётка — из tralebot-prod (см. agent-rbac.yml).
# Ничего, кроме списка подов и проброса порта, в этом namespace не разрешено.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-portforward-loki
  namespace: loki
rules:
  # list нужен чтобы найти под Loki для `kubectl port-forward`.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-portforward-loki
  namespace: loki
subjects:
  - kind: ServiceAccount
    name: agent-readonly
    namespace: tralebot-prod
roleRef:
  kind: Role
  name: agent-portforward-loki
  apiGroup: rbac.authorization.k8s.io
